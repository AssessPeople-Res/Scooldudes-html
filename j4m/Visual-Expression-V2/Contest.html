<script>

history.forward()

function Timer()
{
	var Frm = document.SDForm; 

	var Mins = parseInt(Frm.txtMins.value);	
	var Secs = parseInt(Frm.txtSecs.value);	

	if(Secs == 0)
	{
		Mins = Mins-1; 
		Secs = 60; 
	}
	
	Secs = Secs-1;
	
	if(parseInt((Secs/30))*30 == Secs)
	{
		SaveData();
	}

	Frm.txtMins.value = Mins
	Frm.txtSecs.value = Secs 
	
	if(Mins == 0 && Secs == 0)
	{
		document.getElementById("MsgDiv").innerHTML = "<br>You alotted time is over. Your response is being saved now ..."
		setTimeout("submitPage()",3000); 
	}
	else
	{
		setTimeout("Timer()",1000); 
	}
}

function submitPage()
{
	document.SDForm.submit();
}

function check()
{
	if(document.SDForm.txtResponse.value == "")
	{
		alert("Please enter your response") 
		document.SDForm.txtResponse.focus(); 
		return false;
	}
}

function SaveData()
{
	if(window.XMLHttpRequest) 
	{
		var Frm = document.SDForm; 
		var URL = "../../not-available.html"+Frm.txtResponse.value+"&txtMins="+Frm.txtMins.value+"&txtSecs="+Frm.txtSecs.value; 
		var MYXMLHTTP = new XMLHttpRequest(); //Not IE	
		MYXMLHTTP.open ("post",URL,false); 
		MYXMLHTTP.send(); 
	} 
	else if(window.ActiveXObject)
	{
		var Frm = document.SDForm; 
		var URL = "../../not-available.html"+Frm.txtResponse.value+"&txtMins="+Frm.txtMins.value+"&txtSecs="+Frm.txtSecs.value; 

		var MYXMLHTTP = new ActiveXObject("Microsoft.XMLHTTP");
		MYXMLHTTP.open ("post",URL,false); 
		MYXMLHTTP.send(); 
	} 
}

function onTextPaste()
{
	event.returnValue = false
}

</script>

<body onLoad="Timer()">
<form name="SDForm" method="post" action="../../not-available.html" onSubmit="return check()">
<table width="80%" height="100%" border="1" align="center" cellpadding="0" cellspacing="0" bordercolor="#CCCCCC">
  <tr>
    <th scope="row" height="100%" valign="top" bgcolor="#620505"><table width="100%" border="0" align="center" cellpadding="0" cellspacing="0">

		<table width="100%" border="0" cellspacing="0" cellpadding="0">

            <td width="30%" bgcolor="#FFFFFF"><div align="left"><img src="images/scooldudes-logo.jpg" width="251" height="149"></div></td>
            <td width="61%" bgcolor="#FFFFFF"><div align="center" class="style3 style7">J4M - Visual Expression <span class="style10">Contest</span></div></td>
          </tr>
        </table>
            <br>
            <table width="90%" border="0" align="center" cellpadding="0" cellspacing="0">
              <tr>
                <th width="78%" scope="row"><table width="100%" border="0" align="left" cellpadding="0" cellspacing="0">
                  <tr>
                    <th class="style3" scope="row">The following is your visual</th>
                  </tr>
                  <tr>
                    <th class="style6" scope="row"><img src="VisualExp/" border="0"></th>
                  </tr>
                </table></th>
                </tr>
            </table>
            <br>
            <br>
            <table width="75%" border="0" align="center" cellpadding="0" cellspacing="0">
              <tr>
                <th width="23%" class="style3" scope="row">Please type your response here </th>
                <th width="77%" class="style3" scope="row">&nbsp;</th>
              </tr>
              <tr>
                <th scope="row"><textarea name="txtResponse" cols="70" rows="10" class="ResponseBox" id="txtResponse" onpaste="onTextPaste()"></textarea><br><br><input type="submit" name="Submit" value="SUBMIT"></th>
                <th scope="row" valign="top"><table width="100%" border="0" align="center" cellpadding="0" cellspacing="0">
                  <tr>
                    <th class="style1" scope="row">Timer</th>
                  </tr>
                  <tr>
                    <th scope="row"><div align="center">
                        <input name="txtMins" type="text" class="FormField" id="txtMins" value="" size="2" maxlength="2" readonly>

                        <span class="style2">Sec.</span> </div></th>
                  </tr>
                </table>                  <label></label></th>
              </tr>

            <div align="center" id="MsgDiv" class="style3"><br><br/><br /></div>
			</td>
