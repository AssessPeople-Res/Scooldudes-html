<script>

history.forward()

function Timer()
{
	var Frm = document.SDForm; 

	var Mins = parseInt(Frm.txtMins.value);	
	var Secs = parseInt(Frm.txtSecs.value);	

	if(Secs == 0)
	{
		Mins = Mins-1; 
		Secs = 60; 
	}
	
	Secs = Secs-1;
	
	if(parseInt((Secs/30))*30 == Secs)
	{
		SaveData();
	}

	Frm.txtMins.value = Mins
	Frm.txtSecs.value = Secs 
	
	if(Mins == 0 && Secs == 0)
	{
		document.getElementById("MsgDiv").innerHTML = "<br>You alotted time is over. Your response is being saved now ..."
		setTimeout("submitPage()",3000); 
	}
	else
	{
		setTimeout("Timer()",1000); 
	}
}

function submitPage()
{
	document.SDForm.submit();
}

function check()
{
	if(document.SDForm.txtResponse_1.value == "")
	{
		alert("Please enter your Caption") 
		document.SDForm.txtResponse_1.focus(); 
		return false;
	}
}

function SaveData()
{
	if(window.XMLHttpRequest) 
	{
		var Frm = document.SDForm; 
		var URL = "../../not-available.html"+Frm.txtResponse_1.value+"&txtMins="+Frm.txtMins.value+"&txtSecs="+Frm.txtSecs.value; 
		var MYXMLHTTP = new XMLHttpRequest(); //Not IE	
		MYXMLHTTP.open ("post",URL,false); 
		MYXMLHTTP.send(); 
	} 
	else if(window.ActiveXObject)
	{
		var Frm = document.SDForm; 
		var URL = "../../not-available.html"+Frm.txtResponse_1.value+"&txtMins="+Frm.txtMins.value+"&txtSecs="+Frm.txtSecs.value; 

		var MYXMLHTTP = new ActiveXObject("Microsoft.XMLHTTP");
		MYXMLHTTP.open ("post",URL,false); 
		MYXMLHTTP.send(); 
	} 
}

function onBodyLoad()
{
//	document.SDForm.txtResponse.focus(); 
//	Timer();
	setTimeout("Timer()",1000)
}
